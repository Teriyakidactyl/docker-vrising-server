name: Build V-Rising Server Docker Images

on:
  push:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'README.md'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-vrising-server
  BASE_REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-steamcmd-server

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext-base jq
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Test V Rising contracts
        run: |
          for test_script in tests/test_*.sh; do
            bash "$test_script"
          done

      - name: Validate Compose
        run: docker compose config >/dev/null

  build:
    needs: quality
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        base_tag:
          - trixie_wine-staging
          - bookworm_wine-staging
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Verify GHCR publishing credential
        if: github.event_name != 'pull_request'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo "::error::GHCR_PAT is required to publish child images to the existing GHCR packages"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Prepare tag variables
        run: |
          ARCHITECTURE=$(echo '${{ matrix.platform }}' | cut -d'/' -f2)
          echo "ARCHITECTURE=$ARCHITECTURE" >> "$GITHUB_ENV"

          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            BRANCH_SUFFIX="_dev"
          else
            BRANCH_SUFFIX=""
          fi
          echo "BRANCH_SUFFIX=$BRANCH_SUFFIX" >> "$GITHUB_ENV"

          BASE_TAG_FOR_PULL="${{ matrix.base_tag }}$BRANCH_SUFFIX"
          echo "BASE_TAG_FOR_PULL=$BASE_TAG_FOR_PULL" >> "$GITHUB_ENV"

          BASE_DIST=$(echo '${{ matrix.base_tag }}' | cut -d'_' -f1)
          echo "FULL_TAG=${{ matrix.base_tag }}$BRANCH_SUFFIX-$ARCHITECTURE" >> "$GITHUB_ENV"
          echo "SIMPLE_TAG=$BASE_DIST$BRANCH_SUFFIX-$ARCHITECTURE" >> "$GITHUB_ENV"

          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ matrix.base_tag }}" == "trixie_wine-staging" ]]; then
            echo "LATEST_ARCH_TAG=latest-$ARCHITECTURE" >> "$GITHUB_ENV"
          else
            echo "LATEST_ARCH_TAG=" >> "$GITHUB_ENV"
          fi

          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ env.FULL_TAG }}
            type=raw,value=${{ env.SIMPLE_TAG }}
            ${{ env.LATEST_ARCH_TAG != '' && format('type=raw,value={0}', env.LATEST_ARCH_TAG) || '' }}
          labels: |
            org.opencontainers.image.title=V-Rising Server Docker Image
            org.opencontainers.image.description=V-Rising dedicated server based on docker-steamcmd-server
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.base.image=${{ env.BASE_REGISTRY_IMAGE }}:${{ env.BASE_TAG_FOR_PULL }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_TAG=${{ env.BASE_TAG_FOR_PULL }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.base_tag }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.base_tag }}-${{ matrix.platform }},mode=max

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        base_tag:
          - trixie_wine-staging
          - bookworm_wine-staging

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Prepare manifest tags
        run: |
          BASE_DIST=$(echo '${{ matrix.base_tag }}' | cut -d'_' -f1)

          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            BRANCH_SUFFIX="_dev"
          else
            BRANCH_SUFFIX=""
          fi

          echo "SIMPLE_MANIFEST_TAG=$BASE_DIST$BRANCH_SUFFIX" >> "$GITHUB_ENV"
          echo "FULL_MANIFEST_TAG=${{ matrix.base_tag }}$BRANCH_SUFFIX" >> "$GITHUB_ENV"

          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ matrix.base_tag }}" == "trixie_wine-staging" ]]; then
            echo "HAS_LATEST_TAG=true" >> "$GITHUB_ENV"
          else
            echo "HAS_LATEST_TAG=false" >> "$GITHUB_ENV"
          fi

      - name: Create and push multi-architecture manifests
        run: |
          docker buildx imagetools create             --tag "${{ env.REGISTRY_IMAGE }}:${{ env.SIMPLE_MANIFEST_TAG }}"             "${{ env.REGISTRY_IMAGE }}:${{ env.SIMPLE_MANIFEST_TAG }}-amd64"             "${{ env.REGISTRY_IMAGE }}:${{ env.SIMPLE_MANIFEST_TAG }}-arm64"

          docker buildx imagetools create             --tag "${{ env.REGISTRY_IMAGE }}:${{ env.FULL_MANIFEST_TAG }}"             "${{ env.REGISTRY_IMAGE }}:${{ env.FULL_MANIFEST_TAG }}-amd64"             "${{ env.REGISTRY_IMAGE }}:${{ env.FULL_MANIFEST_TAG }}-arm64"

          if [[ "${{ env.HAS_LATEST_TAG }}" == "true" ]]; then
            docker buildx imagetools create               --tag "${{ env.REGISTRY_IMAGE }}:latest"               "${{ env.REGISTRY_IMAGE }}:latest-amd64"               "${{ env.REGISTRY_IMAGE }}:latest-arm64"
          fi

  notify:
    needs: create-manifest
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Report workflow status
        run: |
          if [[ "${{ needs.create-manifest.result }}" == "success" ]]; then
            echo "::notice::V Rising images successfully built and pushed"
          else
            echo "::error::Failed to build or publish V Rising images"
            exit 1
          fi
