services:
  vrising-server:
    build: .
    container_name: vrising-server
    restart: unless-stopped
    tty: true
    environment:
      SERVER_NAME: ${SERVER_NAME:-My V-Rising Docker Server}
      WORLD_NAME: ${WORLD_NAME:-MyServerWorld}
      SERVER_PASS: ${SERVER_PASS:-SuperSecret}
      SERVER_PORT: ${SERVER_PORT:-9876}
      QUERY_PORT: ${QUERY_PORT:-9877}
      MAX_USERS: ${MAX_USERS:-40}
      LIST_ON_STEAM: ${LIST_ON_STEAM:-true}
      LIST_ON_EOS: ${LIST_ON_EOS:-true}
      SERVER_SECURE: ${SERVER_SECURE:-true}
      RCON_ENABLED: ${RCON_ENABLED:-false}
      RCON_PASS: ${RCON_PASS:-}
      RCON_PORT: ${RCON_PORT:-25575}
    volumes:
      - vrising_data:/world
      - vrising_app:/app
    ports:
      - "${SERVER_PORT:-9876}:${SERVER_PORT:-9876}/udp"
      - "${QUERY_PORT:-9877}:${QUERY_PORT:-9877}/udp"

volumes:
  vrising_data:
    name: vrising_world_data
  vrising_app:
    name: vrising_app_data
